name: quranlive
description: QuranLive is a Flutter app for reading Quran, listening to recitations, checking prayer times, and more.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.3.0
  just_audio: ^0.10.2
  shared_preferences: ^2.3.1
  geolocator: ^13.0.1
  video_player: ^2.2.19

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
